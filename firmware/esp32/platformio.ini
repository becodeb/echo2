; Echo Device — ESP32-S3 Meeting Companion
;
; Hardware de referencia (ver README.md para el cableado):
;   - ESP32-S3 DevKitC-1 (o similar con PSRAM)
;   - Micrófono MEMS I2S INMP441
;   - OLED SSD1306 128x64 (I2C)
;   - Botón físico + LED de estado
;
; NOTA: este firmware compila con PlatformIO pero no fue probado sobre
; hardware real en este repositorio. Ver docs/esp32.md.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    olikraus/U8g2@^2.35.19
    bblanchon/ArduinoJson@^7.0.4
    links2004/WebSockets@^2.4.1
