# Echo web: sirve la SPA y hace de reverse proxy de /api hacia el contenedor
# `api` de la misma red de compose. Un solo origen => sin CORS y con las
# cookies httpOnly de refresh funcionando.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Traefik ya termina TLS; acá solo cabeceras propias del contenido.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             application/manifest+json image/svg+xml;

  # API + WebSockets en vivo. Timeouts largos: la transcripción en vivo
  # mantiene el socket abierto toda la reunión.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 512m;
  }

  # El service worker no se cachea nunca: si no, la app queda vieja.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
  }

  # Los assets con hash en el nombre son inmutables.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # SPA: cualquier ruta desconocida cae en index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
