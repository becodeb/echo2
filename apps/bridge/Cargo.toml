[package]
name = "echo-bridge"
version = "0.1.0"
edition = "2021"
description = "Echo Bridge - motor de transcripcion local. El audio nunca sale de tu maquina."
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
dirs = "5"
which = "6"
reqwest = { version = "0.12", features = ["json", "multipart"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hound = "3.5"
tempfile = "3"

[profile.release]
lto = true
strip = true
opt-level = "z"
